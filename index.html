<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#49051f" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The gift of Inferno. Explore the Inferno Hot Pilates Cyber Monday gift card."
    />
    <title>The Gift of Inferno · Cyber Monday</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#offer">Skip to gift card</a>
    <div class="campaign">
      <div class="campaign__decoration" aria-hidden="true">
        <span class="page-dots page-dots--top-left"></span>
        <span class="page-dots page-dots--top-right"></span>
        <span class="page-dots page-dots--bottom-left"></span>
        <span class="page-dots page-dots--bottom-right"></span>
        <svg class="page-trace page-trace--top-left" viewBox="0 0 220 48">
          <path d="M0 16h100l14 10h88" />
          <circle cx="210" cy="26" r="8" />
        </svg>
        <svg class="page-trace page-trace--top-right" viewBox="0 0 220 48">
          <path d="M0 16h100l24 22h78" />
          <circle cx="210" cy="38" r="8" />
        </svg>
        <svg class="page-trace page-trace--bottom-left" viewBox="0 0 240 48">
          <path d="M0 10h100l28 26h112" />
        </svg>
        <svg class="page-trace page-trace--bottom-right" viewBox="0 0 240 48">
          <path d="M0 10h100l28 26h112" />
        </svg>
      </div>
      <main class="campaign__main">
        <figure class="brand" aria-label="Inferno Hot Pilates">
          <svg class="brand__rings" viewBox="0 0 720 720" aria-hidden="true">
            <defs>
              <linearGradient id="ring-color" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff9a16" />
                <stop offset="45%" stop-color="#ff4b0b" />
                <stop offset="100%" stop-color="#fa1466" />
              </linearGradient>
              <radialGradient id="ring-fill">
                <stop offset="0%" stop-color="#34041b" />
                <stop offset="100%" stop-color="#570524" stop-opacity="0.88" />
              </radialGradient>
            </defs>
            <circle class="brand__ring-outer" cx="360" cy="360" r="337" />
            <circle
              class="brand__ring-orbit"
              cx="360"
              cy="360"
              r="357"
              pathLength="360"
            />
            <circle class="brand__ring-inner" cx="360" cy="360" r="306" />
            <circle
              class="brand__ring-glow"
              cx="360"
              cy="360"
              r="306"
              pathLength="360"
            />
            <circle
              class="brand__ring-lights"
              cx="360"
              cy="360"
              r="306"
              pathLength="360"
            />
            <circle class="brand__ring-ticks" cx="360" cy="360" r="275" />
            <path
              class="brand__ring-marks"
              d="M360 83v13M637 360h-13M360 637v-13M83 360h13"
            />
            <path
              class="brand__brackets"
              d="M106 105H70v38M614 105h36v38M70 577v38h36M650 577v38h-36"
            />
            <path class="brand__seal-lines" d="M143 444h100M477 444h100" />
          </svg>
          <div class="brand__badge" aria-hidden="true">Cyber Monday</div>
          <div class="brand__letters">
            <svg
              class="brand__letter brand__letter--i"
              viewBox="0 0 76 126"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <path d="M21 0H55V126H21Z" />
            </svg>
            <svg
              class="brand__letter brand__letter--h"
              viewBox="0 0 76 126"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <path d="M0 0H34V45H43V0H76V126H43V74H34V126H0Z" />
            </svg>
            <svg
              class="brand__letter brand__letter--p"
              viewBox="-2 0 76 126"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M0 0H35C62 0 72 12 72 37C72 62 62 76 35 76H33V126H0ZM33 22V54H36C43 54 45 50 45 38C45 26 43 22 36 22Z"
              />
            </svg>
          </div>
          <a
            class="brand__seal"
            href="https://infernopilates.com/"
            aria-label="Inferno Hot Pilates home"
          >
            <img
              src="/images/inferno-seal.webp"
              alt=""
              width="256"
              height="256"
              fetchpriority="high"
              decoding="async"
            />
          </a>
          <figcaption class="sr-only">Inferno Hot Pilates. Cyber Monday.</figcaption>
        </figure>

        <section class="offer" id="offer" aria-labelledby="offer-title" tabindex="-1">
          <div id="gift-card-offer">
            <h1 id="offer-title">The gift of <span>Inferno.</span></h1>
            <p class="offer__description">
              All gift cards are <strong>50% off.</strong>
            </p>
            <a
              class="gift-button"
              href="https://go.mindbodyonline.com/book/widgets/pricing/view/c5732322c8/pricing"
              aria-describedby="offer-terms"
            >
              <span>Get the gift card</span>
              <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
                <path d="M3 12h18M14 5l7 7-7 7" />
              </svg>
            </a>
            <p class="offer__terms" id="offer-terms">
              Monday 11/30 only. No exclusions.
            </p>
          </div>
          <div class="checkout-panel" id="gift-card-checkout" hidden>
            <button
              class="checkout-back"
              id="checkout-back"
              type="button"
              aria-label="Close gift cards"
              title="Close gift cards"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
            <h1 class="sr-only" id="checkout-title">Gift cards</h1>
            <p
              class="checkout-panel__status"
              id="checkout-status"
              role="status"
              hidden
            ></p>
            <div class="checkout-options" id="checkout-options">
              <h2>Choose your gift card</h2>
              <p>All gift cards are <strong>50% off.</strong></p>
              <ul class="gift-card-options">
                <li>
                  <a
                    class="gift-card-option"
                    href="https://go.mindbodyonline.com/book/app/pricing/bus_11AXjPEx2ki2C6Zu1/po_11AXjPEx2ki2BzdaX"
                    ><span>Gift Card <strong>$100</strong></span
                    ><span class="gift-card-option__price"
                      ><s>$100</s> <strong>$50</strong></span
                    ></a
                  >
                </li>
                <li>
                  <a
                    class="gift-card-option"
                    href="https://go.mindbodyonline.com/book/app/pricing/bus_11AXjPEx2ki2C6Zu1/po_11AXjPEx2ki2BzdbY"
                    ><span>Gift Card <strong>$250</strong></span
                    ><span class="gift-card-option__price"
                      ><s>$250</s> <strong>$125</strong></span
                    ></a
                  >
                </li>
                <li>
                  <a
                    class="gift-card-option"
                    href="https://go.mindbodyonline.com/book/app/pricing/bus_11AXjPEx2ki2C6Zu1/po_11AXjPEx2ki2BzdcZ"
                    ><span>Gift Card <strong>$500</strong></span
                    ><span class="gift-card-option__price"
                      ><s>$500</s> <strong>$250</strong></span
                    ></a
                  >
                </li>
              </ul>
              <button class="checkout-resume" id="checkout-resume" type="button" hidden>
                Return to checkout
              </button>
            </div>
            <div class="checkout-host" id="mindbody-checkout-host" hidden></div>
            <div class="checkout-skeleton" aria-hidden="true">
              <div class="checkout-skeleton__content">
                <span class="checkout-skeleton__label"></span>
                <span class="checkout-skeleton__heading"></span>
                <span class="checkout-skeleton__description"></span>
                <span class="checkout-skeleton__filter"></span>
                <div class="checkout-skeleton__card"><span></span><span></span></div>
                <div class="checkout-skeleton__card"><span></span><span></span></div>
                <div class="checkout-skeleton__card"><span></span><span></span></div>
              </div>
            </div>
            <div class="checkout-recovery" id="checkout-recovery" hidden>
              <button id="checkout-retry" type="button">Try again</button>
              <a
                id="checkout-hosted"
                href="https://go.mindbodyonline.com/book/widgets/pricing/view/c5732322c8/pricing"
                >Open in Mindbody <span aria-hidden="true">↗</span></a
              >
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
